name: Backend Deploy

# Despliega main en Azure App Service (#67). Se apoya en el ruleset de main: todo lo que
# llega ahí ya pasó Backend CI, así que este workflow no repite las pruebas.
# Nunca se ejecuta con código de PR ni de forks: solo push a main o disparo manual
# desde main. Las acciones van fijadas por SHA; Dependabot actualiza el SHA y el
# comentario de versión.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ya fusionado en main para volver a desplegar (vacío, el último de main)
        required: false
        type: string

permissions:
  contents: read

# Un despliegue en curso nunca se cancela: dejaría la app a medias o detenida.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: backend-deploy
    # AZURE_DEPLOY_ENABLED es una variable del repositorio: se activa al final de la
    # configuración de Azure descrita en docs/deployment.md.
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: smishy-rg
      AZURE_WEBAPP_NAME: smishy-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit that is already in main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The requested commit is not part of main; nothing was deployed."
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Sin caché: este job tiene credenciales de producción.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      # Entra primero: si OIDC falla, no se toca la base.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Los registros de un repositorio público son públicos: el host no debe aparecer.
      - name: Mask the application host
        run: |
          host=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)
          echo "::add-mask::$host"
          label="${host%%.*}"
          if [ "$label" != "$AZURE_WEBAPP_NAME" ]; then
            echo "::add-mask::$label"
          fi
          echo "APP_HOST=$host" >> "$GITHUB_ENV"

      - name: Build the package
        run: >
          git archive --format=zip -o "$RUNNER_TEMP/app.zip" HEAD
          src migrations alembic.ini requirements.txt

      # Las migraciones corren antes del código: deben ser compatibles hacia atrás.
      - name: Apply migrations
        env:
          SMISHING_DATABASE_URL: ${{ secrets.SMISHING_DATABASE_URL }}
        run: |
          if [ -z "$SMISHING_DATABASE_URL" ]; then
            echo "::error::The production database secret is not configured."
            exit 1
          fi
          uv run --no-sync alembic upgrade head
          uv run --no-sync alembic current

      - name: Deploy to App Service
        run: >
          az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_WEBAPP_NAME" --src-path "$RUNNER_TEMP/app.zip" --type zip

      # El arranque en frío tarda de 78 a 207 s en el plan Free.
      - name: Verify health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 30 --output /dev/null \
              "https://$APP_HOST/health"; then
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The application did not become healthy."
          exit 1

      - name: Explain how to recover
        if: ${{ failure() }}
        run: |
          echo "::error::Deployment failed. The app may be stopped. See docs/deployment.md, section 'Despliegue automático'."
