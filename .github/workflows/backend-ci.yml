name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: backend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smishing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMISHING_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only@localhost:5432/smishing_test
      SMISHING_TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only@localhost:5432/smishing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check src tests migrations
      - name: Format
        run: uv run --locked ruff format --check src tests migrations
      - name: Types
        run: uv run --locked mypy
      - name: OpenAPI contract snapshot
        run: uv run --locked pytest tests/test_contract.py -q
      - name: PostgreSQL and HTTPS tests
        run: uv run --locked pytest -q
      - name: Migration round trip and metadata drift
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
      - name: Smoke test local HTTPS and rendered Swagger
        run: |
          PYTHONPATH=tests:src uv run --locked python - <<'PY'
          """CI-only demo against an isolated PostgreSQL service and the actual Swagger page."""
          import base64
          import hashlib
          import json
          import os
          import socket
          import ssl
          import subprocess
          import tempfile
          import threading
          import time
          from io import BytesIO
          from pathlib import Path
          
          import httpx
          import uvicorn
          from alembic import command
          from alembic.config import Config
          
          from conftest import published_metadata
          from smishing_backend.config import Settings
          from smishing_backend.data.connection import create_database_engine
          from smishing_backend.data.model_release import parse_publication
          from smishing_backend.data.repositories.model_catalog import PostgresModelCatalog
          
          os.environ["SMISHING_API_KEY"] = "synthetic-mobile"
          os.environ["SMISHING_ADMIN_CREDENTIALS"] = '{"demo":"synthetic-admin"}'
          from smishing_backend.main import app
          
          command.upgrade(Config("alembic.ini"), "head")
          engine = create_database_engine(Settings().database_url)
          PostgresModelCatalog(engine).register(parse_publication(*published_metadata.__wrapped__()))
          engine.dispose()
          with tempfile.TemporaryDirectory(prefix="swagger-ci-") as name:
              folder = Path(name)
              cert, key = folder / "cert.pem", folder / "key.pem"
              subprocess.run([
                  "openssl", "req", "-x509", "-nodes", "-newkey", "rsa:2048", "-keyout", str(key),
                  "-out", str(cert), "-days", "1", "-subj", "/CN=localhost", "-addext",
                  "subjectAltName=IP:127.0.0.1"
              ], check=True, capture_output=True)
              public_key = subprocess.check_output(["openssl", "x509", "-in", str(cert), "-pubkey", "-noout"])
              der = subprocess.run(["openssl", "pkey", "-pubin", "-outform", "DER"], input=public_key, capture_output=True, check=True).stdout
              pin = base64.b64encode(hashlib.sha256(der).digest()).decode()
              sock = socket.socket()
              sock.bind(("127.0.0.1", 0))
              host = f"https://127.0.0.1:{sock.getsockname()[1]}"
              instance = uvicorn.Server(uvicorn.Config(app, ssl_certfile=str(cert), ssl_keyfile=str(key), access_log=False, proxy_headers=False))
              running = threading.Thread(target=instance.run, kwargs={"sockets": [sock]}, daemon=True)
              running.start()
              try:
                  deadline = time.monotonic() + 15
                  while not instance.started and time.monotonic() < deadline:
                      time.sleep(.025)
                  assert instance.started
                  admin = {"Authorization": "Bearer synthetic-admin"}
                  mobile = {"X-API-Key": "synthetic-mobile"}
                  route = "/api/v1/admin/contributions"
                  with httpx.Client(base_url=host, verify=ssl.create_default_context(cafile=str(cert)), timeout=30) as c:
                      def check(method, url, code, **kwargs):
                          result = c.request(method, url, **kwargs)
                          assert result.status_code == code, (method, url, code, result.status_code)
                          if url.startswith("/api/v1/admin/"):
                              assert result.headers["cache-control"] == "no-store"
                          return result
          
                      assert check("GET", "/health", 200).json() == {"status":"ok"}
                      check("GET", "/docs", 200)
                      paths = check("GET", "/openapi.json", 200).json()["paths"]
                      check("GET", route, 401)
                      reviews = []
                      for label, text in [("safe", "Un mensaje sintético para el recorrido local <URL>"), ("smishing", "Caso de prueba simulado para revisión de corpus <URL>")]:
                          payload = {"text": text, "label": "safe", "model_version": "1.0.0"}
                          identity = check("POST", "/api/v1/contributions", 201, headers=mobile, json=payload).json()["id"]
                          reviews.append((identity, label))
                      listing = check("GET", route + "?status=pending", 200, headers=admin)
                      assert len(listing.json()) == 2
                      sheet_path = "/api/v1/admin/exports/contributions.xlsx"
                      csv_path = "/api/v1/admin/corpus/accepted.csv"
                      if sheet_path in paths:
                          from openpyxl import load_workbook
                          response = check("GET", sheet_path + "?status=pending", 200, headers=admin)
                          book = load_workbook(BytesIO(response.content))
                          for row in list(book["Aportes"].rows)[1:]:
                              row[8].value = "accepted"
                              row[9].value = dict(reviews)[row[0].value]
                              row[10].value = "quality_checked"
                          output = BytesIO()
                          book.save(output)
                          for expected in ("applied", "skipped"):
                              response = check("POST", "/api/v1/admin/exports/reviews.xlsx", 200, headers=admin, files={"file": ("synthetic.xlsx", output.getvalue())})
                              assert [item["status"] for item in response.json()["rows"]] == [expected, expected]
                          print("HTTPS Excel: export 200, 2 aplicadas, reimportación 2 omitidas")
                      else:
                          for identity, label in reviews:
                              check("PATCH", f"{route}/{identity}/review", 200, headers=admin, json={"decision":"accepted","label":label,"reason":"quality_checked"})
                          check("PATCH", f"{route}/{reviews[0][0]}/review", 409, headers=admin, json={"decision":"accepted","label":"safe","reason":"quality_checked"})
                      if csv_path in paths:
                          first = check("GET", csv_path, 200, headers=admin)
                          second = check("GET", csv_path, 200, headers=admin)
                          assert first.content == second.content and first.headers["x-corpus-rows"] == "2"
                          assert first.content.startswith(b"text,label,") and b",1.0.0," in first.content
                          print("HTTPS CSV: 2 filas con revisión, bytes iguales y versión del modelo presente")
                      for identity, label in reviews:
                          check("DELETE", f"{route}/{identity}", 204, headers=admin)
                      print("HTTPS administración: 401 sin Bearer, filtros y revisión 200, borrado 204")
                  chrome = subprocess.run([
                      "google-chrome", "--headless", "--no-sandbox", "--disable-dev-shm-usage",
                      "--user-data-dir=" + str(folder / "chrome"),
                      "--ignore-certificate-errors-spki-list=" + pin,
                      "--virtual-time-budget=12000", "--dump-dom", host + "/docs",
                  ], capture_output=True, text=True, timeout=60)
                  assert chrome.returncode == 0
                  expected = ["Administración de aportes"]
                  if sheet_path in paths:
                      expected.append("Excel de revisión")
                  if csv_path in paths:
                      expected.append("Corpus final")
                  assert all(tag in chrome.stdout for tag in expected), "Swagger tags not rendered"
                  print("Swagger HTTPS renderizado en Chromium: " + ", ".join(expected))
              finally:
                  instance.should_exit = True
                  running.join(5)
                  sock.close()
          PY
      - name: Build verified App Service package
        run: |
          git archive --format=zip -o app.zip HEAD src migrations alembic.ini requirements.txt
          sha256sum app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: smishy-backend-app-service
          path: app.zip
          if-no-files-found: error
          retention-days: 7
