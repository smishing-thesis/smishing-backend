# Actualizaciones de versiones de Dependabot (#60). Las actualizaciones de seguridad
# se activan aparte, en los ajustes del repositorio.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # spacy debe coincidir con el modelo es_core_news_lg-3.8.0 (ver pyproject.toml).
      - dependency-name: "spacy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
