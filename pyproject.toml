[project]
name = "smishing-backend"
version = "0.1.0"
description = "Backend for the smishing thesis corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "defusedxml>=0.7.1,<1",
    "es-core-news-lg",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1.5,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "python-multipart>=0.0.22,<0.1",
    "spacy>=3.8,<3.9",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=2.4.1",
    "pandas>=2.2,<3",
    "pytest>=8,<10",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smishing_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/smishing_backend"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.uv.sources]
es-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl" }
