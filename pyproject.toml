[project]
name = "smishing-backend"
version = "0.1.0"
description = "Backend for the smishing thesis corpus"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smishing_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
